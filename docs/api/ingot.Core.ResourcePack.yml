  source:
    remote:
      path: ingot.Core/ResourcePack.cs
      branch: master
      repo: https://github.com/pyroboots/ingot.git
    id: AddBlockTexture
    path: ../ingot.Core/ResourcePack.cs
    startLine: 42
  assemblies:
  - ingot.Core
  namespace: ingot.Core
  summary: >-
    Registers a texture (PNG on disk) that will be copied into the resource pack under

    <code>textures/blocks/</code> and referenced from <code>terrain_texture.json</code>.

    The <code class="paramref">key</code> must match the texture name(s) used in your block

    <code>MaterialInstances</code> (or <code>IDestructionParticles</code>).
  example: []
  syntax:
    content: public ResourcePack AddBlockTexture(string key, string sourcePngPath)
    parameters:
    - id: key
      type: System.String
      description: The texture key (the value used in behaviour-side material instances).
    - id: sourcePngPath
      type: System.String
      description: Path to the source .png file on disk (will be copied as-is).
    return:
      type: ingot.Core.ResourcePack
    content.vb: Public Function AddBlockTexture(key As String, sourcePngPath As String) As ResourcePack
  overload: ingot.Core.ResourcePack.AddBlockTexture*
  nameWithType.vb: ResourcePack.AddBlockTexture(String, String)
  fullName.vb: ingot.Core.ResourcePack.AddBlockTexture(String, String)
  name.vb: AddBlockTexture(String, String)
