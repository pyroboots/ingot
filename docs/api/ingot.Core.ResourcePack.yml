  assemblies:
  - ingot.Core
  namespace: ingot.Core
  summary: >-
    Registers a texture (PNG on disk) that will be copied into the resource pack under

    <code>textures/items/</code> and referenced from <code>item_texture.json</code>.

    The <code class="paramref">key</code> must match the <code>Texture</code> property on your <code>Item</code> definitions.
  example: []
  syntax:
    content: public ResourcePack AddItemTexture(string key, string sourcePngPath)
    parameters:
    - id: key
      type: System.String
      description: The texture key (the value used in behaviour-side <code>minecraft:icon</code>).
    - id: sourcePngPath
      type: System.String
      description: Path to the source .png file on disk (will be copied as-is).
    return:
      type: ingot.Core.ResourcePack
    content.vb: Public Function AddItemTexture(key As String, sourcePngPath As String) As ResourcePack
