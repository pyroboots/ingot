# Packs ingot.Core on every published GitHub Release and attaches the
# .nupkg / .snupkg to that release. Package version is the release tag
# with a leading "v" stripped (e.g. v0.23.0 -> 0.23.0).
#
# Pushes to nuget.org via Trusted Publishing (OIDC). No API key secret.
# Create a policy at https://www.nuget.org/account/trustedpublishing :
#   Repository Owner: pyroboots
#   Repository:       ingot
#   Workflow File:    nuget.yml
#   Environment:      release
name: NuGet

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  pack:
    runs-on: ubuntu-latest
    environment: release

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Resolve package version
      id: version
      run: |
        tag='${{ github.event.release.tag_name }}'
        version="${tag#v}"
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?(\+[A-Za-z0-9.-]+)?$ ]]; then
          echo "Release tag '$tag' is not a valid NuGet/SemVer version (optional leading v is allowed)."
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Restore dependencies
      run: dotnet restore

    - name: Test
      run: dotnet test --configuration Release --no-restore --verbosity normal

    - name: Pack
      run: >
        dotnet pack ingot.Core/ingot.Core.csproj
        --configuration Release
        --no-restore
        --output artifacts/nuget
        -p:Version=${{ steps.version.outputs.version }}
        -p:PackageVersion=${{ steps.version.outputs.version }}

    - name: Attach packages to release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "${{ github.event.release.tag_name }}" artifacts/nuget/* --clobber

    - name: NuGet login (OIDC)
      uses: NuGet/login@v1
      id: login
      with:
        user: pyroboots

    - name: Publish to NuGet.org
      run: >
        dotnet nuget push artifacts/nuget/*.nupkg
        --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
        --source https://api.nuget.org/v3/index.json
        --skip-duplicate
