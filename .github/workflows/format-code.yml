name: Code Formatting

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

# Required permissions
permissions:
  contents: write
  pull-requests: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Apply whitespace formatting (changed files only)
        run: |
          changed_files=\( (git diff --name-only --diff-filter=ACM origin/ \){{ github.base_ref || 'master' }} | grep -E '\.cs$' || true)
          if [ -n "$changed_files" ]; then
            echo "Formatting files:"
            echo "$changed_files"
            dotnet format whitespace --no-restore --include $changed_files
          else
            echo "No C# files to format."
          fi

      - name: Commit formatting changes (if any)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: apply whitespace formatting"
          file_pattern: "*.cs"
          commit_options: "--no-verify"